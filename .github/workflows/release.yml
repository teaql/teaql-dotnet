name: Publish .NET packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable signed release tag to publish
        required: true
        type: string
  push:
    tags:
      - "dotnet-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    env:
      TEAQL_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install test inventory tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Verify tag matches package version
        shell: bash
        run: |
          [[ "$TEAQL_RELEASE_TAG" =~ ^dotnet-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          expected="${TEAQL_RELEASE_TAG#dotnet-v}"
          actual="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)"
          test "$expected" = "$actual"
      - name: Require a verified signed release tag
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tagged_commit="$(git rev-list -n 1 "$TEAQL_RELEASE_TAG")"
          test -n "$tagged_commit"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$tagged_commit" = "$GITHUB_SHA"
          fi
          GITHUB_REF_NAME="$TEAQL_RELEASE_TAG" GITHUB_SHA="$tagged_commit" \
            python3 scripts/verify_signed_release_tag.py
      - name: Test signed release tag verifier
        run: python3 scripts/test_verify_signed_release_tag.py
      - name: Verify every source test project (including Core)
        run: bash scripts/verify-trace-chain-source-tests.sh artifacts/test-results -c Release -p:UseSharedCompilation=false
      - name: Pack public projects
        shell: bash
        run: |
          projects=(
            TeaQL.Core TeaQL.DataService TeaQL.Sql TeaQL.Runtime
            TeaQL.BlobReference TeaQL.SecureDocumentReference
            TeaQL.ObjectStorage.S3
            TeaQL.Provider.Sqlite TeaQL.Provider.PostgreSql TeaQL.Provider.MySql
            TeaQL.Provider.SqlServer TeaQL.CacheIntegration.Redis
            TeaQL.WebIntegration.AspNetCore TeaQL.TfpEndpoint TeaQL.Telemetry.OpenTelemetry
          )
          for project in "${projects[@]}"; do
            dotnet pack "src/${project}/${project}.csproj" -c Release --no-restore \
              -p:UseSharedCompilation=false -o artifacts
          done
      - name: Verify exact release candidates
        run: python3 scripts/verify-release-candidates.py artifacts
      - name: Test release identity and absence guards
        run: |
          python3 scripts/test_verify_signed_release_tag.py
          python3 scripts/test_verify_public_release_absence.py
      - name: Run optional module and S3 consumers from exact candidates
        run: python3 scripts/verify-optional-reference-consumers.py "$PWD" artifacts --include-s3
      - name: Refuse any version already present on NuGet
        run: python3 scripts/verify-public-release-absence.py artifacts
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish packages
        run: >-
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
