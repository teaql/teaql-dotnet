name: Promote qualified dotnet packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing signed tag whose exact packages passed internal qualification
        required: true
        type: string
      qualification_sha256:
        description: SHA-256 of logging-qualification.json retained with the release evidence
        required: true
        type: string

concurrency:
  group: dotnet-public-promotion
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - name: Verify signed source and qualified package bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          QUALIFICATION_SHA256: ${{ inputs.qualification_sha256 }}
        shell: bash
        run: |
          export GNUPGHOME="$RUNNER_TEMP/teaql-release-signatures"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --import .github/release-signing-key.asc
          python3 scripts/verify-qualified-release.py \
            --tag "$RELEASE_TAG" --manifest-sha256 "$QUALIFICATION_SHA256" \
            --language dotnet --repository "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: qualified-dotnet-packages
          path: qualified-packages/
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qualified-dotnet-packages
          path: qualified-packages/
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish the verified packages
        run: >-
          dotnet nuget push "qualified-packages/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
